services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    image: korean-chatbot-backend:latest
    container_name: korean-chatbot-backend
    restart: unless-stopped
    ports:
      - "9000:9000"
    environment:
      DB_HOST: ${DB_HOST:-host.docker.internal}
      DB_PORT: ${DB_PORT:-5435}
      DB_NAME: ${DB_NAME:-korean_dict}
      DB_USER: ${DB_USER:-dictuser}
      DB_PASSWORD: ${DB_PASSWORD}
      VLLM_URL: ${VLLM_URL:-http://host.docker.internal:11434/v1}
      VLLM_MODEL: ${VLLM_MODEL:-gemma3:12b}
      VLLM_MODEL_DENSE: ${VLLM_MODEL_DENSE:-exaone3.5:7.8b}
      VLLM_URL_DENSE: ${VLLM_URL_DENSE:-http://host.docker.internal:11434/v1}
      VLLM_MAX_TOKENS: ${VLLM_MAX_TOKENS:-2048}
      VLLM_TEMPERATURE: ${VLLM_TEMPERATURE:-0.1}
      OLLAMA_URL: ${OLLAMA_URL:-http://host.docker.internal:11434/api/embeddings}
      EMBED_MODEL: ${EMBED_MODEL:-bge-m3}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      CLAUDE_MODEL: ${CLAUDE_MODEL:-claude-opus-4-8}
      CLAUDE_MAX_TOKENS: ${CLAUDE_MAX_TOKENS:-2048}
      RERANKER_URL: ${RERANKER_URL:-http://host.docker.internal:8100}
      RAG_TOP_K: ${RAG_TOP_K:-15}
      RAG_RERANK_TOP_N: ${RAG_RERANK_TOP_N:-6}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - chatbot-network
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0) if urllib.request.urlopen('http://127.0.0.1:9000/health', timeout=3).status==200 else sys.exit(1)"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

networks:
  chatbot-network:
    name: korean-chatbot-network
    driver: bridge
