# 개발용 오버라이드 — 자동으로 docker-compose.yml과 합쳐짐(docker compose 표준 동작).
# app/ 전체를 바인드마운트하고 --reload로 띄워서 리빌드 없이 코드 변경이 바로
# 반영되게 한다. 배포용 Dockerfile 빌드와는 별개 — 프로덕션 배포 시에는 이 파일을
# 무시하고 docker-compose.yml만 써야 한다(예: docker compose -f docker-compose.yml up -d).
#
# 개별 파일(main.py 등) 대신 디렉토리 전체를 통째로 마운트하는 이유: Docker의
# 단일 파일 바인드마운트는 호스트 에디터가 파일을 원자적 교체(새로 쓰고
# rename)하는 방식으로 저장하면 컨테이너 쪽 마운트가 옛 inode에 붙들려 끊긴다
# — 디렉토리 마운트는 이 문제가 없다(2026-07-31 실측 확인).
#
# app/static/은 프로덕션 빌드 산출물이라 호스트에 없으면(gitignore) StaticFiles
# 마운트가 시작 시 죽는다 — 로컬에 빈 app/static/ 디렉토리를 만들어두면 된다
# (프론트 개발은 이 컨테이너가 아니라 `npm run dev`로 별도 진행).
services:
  backend:
    volumes:
      - ./app:/app/app
    # app/dynamic_tools/는 런타임에 스킬빌더가 직접 파일을 쓰는 곳이라, 이걸
    # 감시 대상에 포함하면 "복원 쓰기 → 리로드 감지 → 재시작 → 다시 복원 쓰기"로
    # 무한 재시작 루프에 빠짐 — reload-exclude로 명시적으로 제외
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "9000", "--reload",
              "--reload-dir", "/app/app",
              "--reload-exclude", "*/dynamic_tools/*"]
